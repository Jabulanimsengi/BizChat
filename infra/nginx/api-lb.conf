# API load balancer for the high-availability reference deployment (docker-compose.ha.yml).
# TLS terminates in front of this (managed load balancer or edge proxy); set TRUSTED_PROXIES to the
# address this container connects from.
#
# The dashboard and widget connect over WebSocket only, so any replica can take any socket: the
# Socket.IO Redis adapter fans events out across replicas. Socket.IO still accepts HTTP
# long-polling, whose requests must keep reaching one replica, so /socket.io/ is balanced by client
# address instead of by load.

# Docker's DNS lists every replica of the scaled api service; nginx re-resolves it (the resolve
# parameter, open source since 1.27.3), so replicas can be added, restarted, or replaced without a
# reload. A replica that fails twice is skipped for 10 s; Docker restarts it if its health fails.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream bizchat_api {
  zone bizchat_api 64k;
  least_conn;
  server api:4000 resolve max_fails=2 fail_timeout=10s;
  keepalive 32;
}

upstream bizchat_api_sockets {
  zone bizchat_api_sockets 64k;
  hash $remote_addr consistent;
  server api:4000 resolve max_fails=2 fail_timeout=10s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' '';
}

server {
  listen 8080;
  server_name _;

  # Attachments are limited by the API; leave headroom for multipart overhead.
  client_max_body_size 12m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Request-Id $request_id;

  location /socket.io/ {
    proxy_pass http://bizchat_api_sockets;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Sockets stay open for hours; heartbeats keep them active well inside this.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    proxy_pass http://bizchat_api;
    proxy_set_header Connection '';
    # Retry another replica only for requests that cannot have changed anything.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_read_timeout 60s;
  }

  # Prometheus scrapes each replica directly; do not expose metrics through the balancer.
  location = /api/v1/metrics {
    return 404;
  }
}
