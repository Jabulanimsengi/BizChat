services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizchat
      POSTGRES_USER: bizchat
      POSTGRES_PASSWORD: bizchat
    ports:
      - '${BIZCHAT_POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bizchat -d bizchat']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - bizchat-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - '${BIZCHAT_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bizchat-redis:/data

volumes:
  bizchat-postgres:
  bizchat-redis:
