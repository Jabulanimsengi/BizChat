services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bizchat
      POSTGRES_USER: bizchat
      POSTGRES_PASSWORD: bizchat
    ports:
      - '127.0.0.1:55440:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bizchat -d bizchat']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '']
    ports:
      - '127.0.0.1:56380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    # The bundled MinIO has no KMS, so client-side SSE is disabled for the test stack.
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: bizchat
      MINIO_ROOT_PASSWORD: bizchat-secret
    ports:
      - '127.0.0.1:59000:9000'
      - '127.0.0.1:59001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 3s
      timeout: 3s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 bizchat bizchat-secret &&
        mc mb --ignore-existing local/bizchat-attachments

  clamav:
    image: clamav/clamav:stable
    ports:
      - '127.0.0.1:53310:3310'
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 180s
