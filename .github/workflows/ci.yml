name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Unit test coverage gate
        run: npm run test:cov
      - name: Audit production dependencies
        run: npm run audit:production

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql://bizchat:bizchat@127.0.0.1:55440/bizchat?schema=public
      REDIS_URL: redis://127.0.0.1:56380
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: bizchat-attachments
      S3_ACCESS_KEY_ID: bizchat
      S3_SECRET_ACCESS_KEY: bizchat-secret
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '53310'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start real dependencies
        run: npm run test:stack:up
      - name: Generate Prisma client and apply migrations
        run: npm run db:generate && npm run db:migrate
      - name: HTTP integration suite
        run: npm run test:http
      - name: End-to-end smoke suite
        run: npm run e2e
      - name: Backup and restore drill
        run: npm run e2e:backup-restore
      - name: Stop real dependencies
        if: always()
        run: npm run test:stack:down

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      REDIS_PASSWORD: ci-redis-password
      SESSION_SECRET: ci-session-secret-32-characters-long
      WIDGET_TOKEN_SECRET: ci-widget-secret-32-characters-long
      APP_URL: https://api.example.invalid
      DASHBOARD_URL: https://app.example.invalid
      NEXT_PUBLIC_API_URL: https://api.example.invalid/api/v1
      NEXT_PUBLIC_WIDGET_URL: https://cdn.example.invalid/widget.js
      TRUSTED_PROXIES: 10.0.0.1/32
      S3_ACCESS_KEY_ID: ci-object-storage-key
      S3_SECRET_ACCESS_KEY: ci-object-storage-secret
      SMTP_HOST: smtp.example.invalid
      SMTP_FROM: 'BizChat <no-reply@example.invalid>'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.production.yml config --quiet
      - name: Build production images
        run: docker compose -f docker-compose.production.yml build
      - name: Generate release manifest
        run: npm run release:manifest
      - name: Start production stack
        run: docker compose -f docker-compose.production.yml up -d --wait
      - name: Production container smoke
        run: node tools/production-smoke.mjs
      - name: Stop production stack
        if: always()
        run: docker compose -f docker-compose.production.yml down -v --remove-orphans
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-manifest
          path: var/release-manifest.json
